name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile core modules
        run: >-
          python -m py_compile
          EnvioMain.py EnvioMain1.py detenciones.py minutosdetenidosenvio.py
          UltimaUbicacion.py tools/trackear_diferencias_samsara.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
